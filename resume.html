<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Dave Domingo</title>
    <meta name="description" content="Dave Domingo's Applied-AI resume.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/core.css?v=5">
  </head>
  <body>
    <!-- Minimal bar, not the full site header/nav -- once someone's on the
         resume page there's nothing else to navigate to from here, so the
         full Work/Resume/Contact nav is pure overhead eating vertical
         space (Dave's call, 2026-09-17). Just a way back to the site and
         the download action. -->
    <div style="display:flex; justify-content:space-between; align-items:center; gap: var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border);">
      <a href="index.html" class="site-name" style="font-size:15px;">Dave Domingo</a>
      <a href="resume.pdf" download class="btn-pill btn-pill-secondary">Download PDF</a>
    </div>

    <object data="resume.pdf" type="application/pdf" style="display:block; width:100%; height:calc(100vh - 53px); border:none;">
      <p style="text-align:center; padding: var(--space-6);">
        Your browser can't display the PDF inline.
        <a href="resume.pdf">Open the resume directly</a> instead.
      </p>
    </object>
  </body>
</html>
